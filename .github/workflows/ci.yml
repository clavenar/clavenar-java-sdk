name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build (jdk ${{ matrix.java }})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        java: ['17.0.19+10', '21.0.11+10.0.LTS']
    steps:
      - name: Attach retained self-hosted checkout commit
        run: |
          if git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C "$GITHUB_WORKSPACE" update-ref refs/clavenar/runner-retained HEAD
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B verify

  dependencies:
    name: dependency analysis
    runs-on: self-hosted
    steps:
      - name: Attach retained self-hosted checkout commit
        run: |
          if git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C "$GITHUB_WORKSPACE" update-ref refs/clavenar/runner-retained HEAD
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17.0.19+10'
          cache: maven
      - run: mvn -B test-compile dependency:analyze-only -DfailOnWarning=true

  examples:
    name: examples
    runs-on: self-hosted
    steps:
      - name: Attach retained self-hosted checkout commit
        run: |
          if git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C "$GITHUB_WORKSPACE" update-ref refs/clavenar/runner-retained HEAD
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17.0.19+10'
          cache: maven
      - run: mvn -B install -DskipTests
      - run: mvn -B -f examples/pom.xml verify

  sbom:
    name: sbom
    runs-on: self-hosted
    steps:
      - name: Attach retained self-hosted checkout commit
        run: |
          if git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C "$GITHUB_WORKSPACE" update-ref refs/clavenar/runner-retained HEAD
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17.0.19+10'
          cache: maven
      - run: mvn -B -DskipTests package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            target/bom.json
            target/bom.xml
          if-no-files-found: error
